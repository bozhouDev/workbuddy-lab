# 路线：模式（默认 / Plan / Ask）—— 完整样板，其它路线照这个写
title: 模式：默认 / Plan / Ask
chapter: send-task
guide: /features/send-task/mode/
illustrative: true # 「直接覆盖原文件」的后果还没在 5.11.3 真机上复现，复现后改成 false
start: intro

# 场景：外壳的状态快照，每拍引用一个
scenes:
  home:
    view: home
    composer: { text: 帮我把这份周报改得专业一点 @周报.docx, group: WorkBuddy-练习 }
  plus-open:
    view: home
    overlay: plusMenu
    composer: { text: 帮我把这份周报改得专业一点 @周报.docx, group: WorkBuddy-练习 }
  overwritten: # 选了默认模式：原文件被覆盖
    view: chat
    composer: { mode: default, group: WorkBuddy-练习 }
    messages:
      - role: user
        blocks: [{ type: text, text: 帮我把这份周报改得专业一点 @周报.docx }]
      - role: assistant
        blocks:
          - { type: text, text: 已把措辞改得更正式，删去了不够书面的表述。 }
          - { type: file, name: 周报.docx, status: overwritten }
    artifacts:
      file: 周报.docx
      badge: 已覆盖
      lines:
        - { text: 本周完成 3 场客户回访，其中 1 家续约意向明确。, change: removed }
        - { text: 本周客户关系维护工作稳步推进，取得阶段性成果。, change: added }
        - { text: 原定周三上线的报表功能延期至下周一 }
        - { text: ，原因是数据口径待财务确认。, change: removed }
        - { text: 下周计划：跟进续约合同；推动报表上线。, change: removed }
        - { text: 下周将持续推进各项重点工作。, change: added }
  planned: # 选了 Plan：先出方案
    view: chat
    composer: { mode: plan, group: WorkBuddy-练习 }
    messages:
      - role: user
        blocks: [{ type: text, text: 帮我把这份周报改得专业一点 @周报.docx }]
      - role: assistant
        blocks:
          - type: plan
            items:
              - 另存为 周报-修改版.docx，不覆盖原文件
              - 按「完成 / 问题 / 下周计划」三段重排
              - 数字和延期原因全部保留，只改措辞
            ask: 还需要你确认：这份周报是给谁看的？
    artifacts:
      file: 周报.docx
      badge: 未修改
      lines:
        - { text: 本周完成 3 场客户回访，其中 1 家续约意向明确。 }
        - { text: 原定周三上线的报表功能延期至下周一，原因是数据口径待财务确认。 }
        - { text: 下周计划：跟进续约合同；推动报表上线。 }
  asked: # 选了 Ask：只给建议，不动文件
    view: chat
    composer: { mode: ask, group: WorkBuddy-练习 }
    messages:
      - role: user
        blocks: [{ type: text, text: 帮我把这份周报改得专业一点 @周报.docx }]
      - role: assistant
        blocks:
          - { type: text, text: 可以从三个地方改：开头先写结果；「延期」后写清原因和新时间；下周计划写成能检查的事项。 }
          - { type: note, text: 当前是 Ask 模式，我没有修改任何文件。 }

beats:
  # 1 是什么
  - id: intro
    step: what
    scene: home
    say: 模式决定它拿到任务后怎么干：直接动手、先出方案，还是只回答不动手。

  # 2 在哪里
  - id: find-plus
    step: where
    say: 模式藏在输入框左下角的 +。点一下。
    spotlight: composer.plus
    await: { click: composer.plus }
  - id: find-mode
    step: where
    scene: plus-open
    say: 这里有 Plan 和 Ask 两个开关。两个都不开，就是默认模式。
    spotlight: plusMenu.mode

  # 3 什么时候用
  - id: when
    step: when
    say: 目标明确用默认；需求还模糊、改动大，用 Plan；只想问问思路，用 Ask。
    spotlight: plusMenu.mode

  # 4 试一下
  - id: pick
    step: try
    say: 「改得专业一点」到底改哪些地方，你自己也还没想好。这时候用哪个模式？
    spotlight: plusMenu.mode
    choices:
      - { label: 默认, hint: 两个开关都不开，直接发, goto: wrong-default }
      - { label: Plan, hint: 先让它出方案, goto: right-plan }
      - { label: Ask, hint: 只问问它怎么改, goto: neutral-ask }

  # 5 用错了会怎样（从选项跳进来）
  - id: wrong-default
    step: mistake
    scene: overwritten
    tone: wrong
    say: 它直接覆盖了原文件。数字没了，延期原因也被删了，换成了一句空话。需求还模糊时用默认模式，最容易出这种事。
    spotlight: artifacts.diff
    next: right-plan
  - id: neutral-ask
    step: try
    scene: asked
    tone: neutral
    say: Ask 只看、只回答，不改任何文件。想思路时很好用，但这次你要的是改好的文件，得换成 Plan。
    spotlight: chat.lastReply
    next: right-plan
  - id: right-plan
    step: try
    scene: planned
    tone: right
    say: 对了。它先把方案摆出来，等你确认才动手。可以删掉不要的步骤、补上在意的细节。注意第 1 条：另存，不覆盖原文件。
    spotlight: chat.plan
  - id: replay-mistake # 直接选对的人，也要看一眼选错的后果
    step: mistake
    scene: overwritten
    tone: wrong
    skipIfVisited: wrong-default
    say: 顺便看看：如果刚才选了默认，它会直接覆盖原文件，数字和延期原因都被删了。
    spotlight: artifacts.diff

  # 6 一句话记住
  - id: remember
    step: remember
    scene: home
    say: 没想清楚，先开 Plan；只想问问，用 Ask；目标明确，再用默认。回到真机：输入框左下角 + → 模式。
