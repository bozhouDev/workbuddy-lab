  - { id: try, step: try, scene: chat-after, tone: right, say: 写入泊舟 5 条指令模板并保存，同一句重跑直接给结论，缺失字段标「未明确」。 }
  - { id: remember, step: remember, scene: chat-after, say: 指令写 5 条短红线就够，别抄两千字长规则；人设管性格，长期记忆写你的固定背景。 }
