beats:
  - { id: intro, step: what, scene: home, say: 给 WorkBuddy 的指令管做事红线，写好 5 条短规矩后每次对话自动生效。 }
  - { id: where, step: where, say: 左下角头像 → 设置 → 个性化 → 给 WorkBuddy 的指令。 }
  - { id: when, step: when, say: 开局一次性配好，区分清楚「指令」「人设设定」和「长期记忆」三个框。 }
